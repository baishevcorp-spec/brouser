<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Только локальные ресурсы: никаких внешних шрифтов/скриптов -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Brouser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ===== Панель инструментов: фиксированная высота, сетка ниже — не перекрывается ===== -->
    <header id="toolbar" class="glass" role="toolbar" aria-label="Панель инструментов">
      <div class="brand" aria-label="Brouser">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3"  y="3"  width="8" height="8" rx="2.2" fill="currentColor" opacity="1"/>
          <rect x="13" y="3"  width="8" height="8" rx="2.2" fill="currentColor" opacity=".45"/>
          <rect x="3"  y="13" width="8" height="8" rx="2.2" fill="currentColor" opacity=".45"/>
          <rect x="13" y="13" width="8" height="8" rx="2.2" fill="currentColor" opacity="1"/>
        </svg>
      </div>

      <!-- Выбор раскладки: только иконки + rich-тултипы (прозрачное окно поверх views) -->
      <div class="group" role="radiogroup" aria-label="Раскладка сетки" id="layout-group">
        <button class="ibtn" data-layout="1x1" data-icon="grid-1x1" data-tip-id="layout-1x1" aria-label="Раскладка 1 на 1"></button>
        <button class="ibtn" data-layout="1x2" data-icon="grid-1x2" data-tip-id="layout-1x2" aria-label="Раскладка 1 на 2"></button>
        <button class="ibtn" data-layout="2x1" data-icon="grid-2x1" data-tip-id="layout-2x1" aria-label="Раскладка 2 на 1"></button>
        <button class="ibtn" data-layout="2x2" data-icon="grid-2x2" data-tip-id="layout-2x2" aria-label="Раскладка 2 на 2"></button>
        <button class="ibtn" data-layout="3x1" data-icon="grid-3x1" data-tip-id="layout-3x1" aria-label="Раскладка 3 на 1"></button>
        <button class="ibtn" data-layout="1x3" data-icon="grid-1x3" data-tip-id="layout-1x3" aria-label="Раскладка 1 на 3"></button>
      </div>

      <div class="sep" aria-hidden="true"></div>

      <!-- Действия: добавить / удалить выбранный / перезагрузить все / синхронизатор / сохранить / тема / журнал -->
      <div class="group">
        <button id="btn-add" class="ibtn accent" data-icon="plus" data-tip-id="btn-add" aria-label="Добавить профиль"></button>
        <button id="btn-remove" class="ibtn danger" data-icon="trash" data-tip-id="btn-remove" aria-label="Удалить выбранный профиль" disabled></button>
        <button id="btn-reload-all" class="ibtn" data-icon="rotate" data-tip-id="btn-reload-all" aria-label="Перезагрузить все"></button>
        <button id="btn-sync" class="ibtn" data-icon="zap" data-tip-id="btn-sync-off" aria-label="Синхронизатор действий" aria-pressed="false"></button>
        <button id="btn-save" class="ibtn" data-icon="save" data-tip-id="btn-save" aria-label="Сохранить конфиг"></button>
        <button id="btn-theme" class="ibtn" data-icon="palette" data-tip-id="btn-theme" aria-label="Сменить тему"></button>
        <button id="btn-logs" class="ibtn" data-icon="logs" data-tip-id="btn-logs" aria-label="Журнал" aria-expanded="false"></button>
      </div>

      <div class="spacer"></div>

      <!-- Счётчик профилей/ячеек (числа только) -->
      <div class="counter" id="counter" data-tip-id="counter">0/0</div>

      <!-- Кнопки окна (frameless) -->
      <div class="group winctl">
        <button id="win-min" class="ibtn" data-icon="minus" data-tip-id="win-min" aria-label="Свернуть"></button>
        <button id="win-max" class="ibtn" data-icon="square" data-tip-id="win-max" aria-label="Развернуть"></button>
        <button id="win-close" class="ibtn danger" data-icon="x" data-tip-id="win-close" aria-label="Закрыть"></button>
      </div>
    </header>

    <!-- ===== Сетка профилей ===== -->
    <!-- Каждая ячейка: шапка (HTML) + тело; в тело main ставит WebContentsView по координатам -->
    <main id="grid" class="grid" aria-label="Сетка профилей"></main>
  </div>

  <!-- Модалки «Добавить профиль» и «Импорт cookies» больше не HTML-оверлеи:
       WebContentsView — нативный слой поверх рендерера, HTML-модалки уходили
       под сетку. Все диалоги — отдельные BrowserWindow с parent (main:
       windows/dialogWindow.ts), данные передаются через query. -->

  <!-- ===== Журнал ===== -->
  <div id="logpanel" class="glass card" hidden aria-label="Журнал событий"></div>

  <!-- ===== Тост-индикатор результата ===== -->
  <div id="toast" class="counter" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>

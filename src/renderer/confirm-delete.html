<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Только локальные ресурсы -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Удалить профиль</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dialog">
  <!--
    Подтверждение удаления профиля — отдельное BrowserWindow (родитель —
    главное окно; НЕ модальное). Заголовок и закрытие — в нативном тайтл-баре;
    внутри — только пояснение и кнопки Да/Нет: прежняя HTML-кнопка «вооружалась»
    вторым нажатием (подтверждение перекрывалось views).
  -->
  <div class="glass card confirm-card">
    <p class="confirm-text" id="cfm-text">Профиль будет удалён вместе с сессией и cookies. Это действие необратимо.</p>
    <div id="cfm-status" class="hint" hidden></div>
    <div class="modal-actions">
      <button type="button" id="cfm-cancel" class="ibtn sm" data-icon="x" data-tip="Отмена" aria-label="Отмена"></button>
      <button type="button" id="cfm-delete" class="ibtn sm danger wide" data-icon="trash" aria-label="Удалить">Удалить</button>
    </div>
  </div>

  <script src="dialog-confirm-delete.js"></script>
</body>
</html>

# Конфигурация electron-builder для Brouser.
# Сборка: npm run dist:win (NSIS), npm run dist:linux (AppImage), npm run dist:mac (dmg, опционально).
appId: com.baishevcorp.brouser
productName: Brouser
copyright: BaishevCorp

directories:
  output: release
  buildResources: assets

# В установщик попадает только скомпилированный код + package.json.
files:
  - dist/**/*
  - package.json

# Папка extensions упаковывается в resources/extensions,
# чтобы в упакованном приложении работали относительные пути расширений.
# Документация (README/BACKLOG/ROADMAP/docs) — источник search_faq
# тул-а ассистента (P4/этап 2): в dev — корень проекта, в релизе — resources.
extraResources:
  - from: extensions
    to: extensions
    filter:
      - "**/*"
      - "!.gitkeep"
  - from: README.md
    to: README.md
  - from: BACKLOG.md
    to: BACKLOG.md
  - from: ROADMAP.md
    to: ROADMAP.md
  - from: docs
    to: docs
    filter:
      - "**/*.md"

asar: true
icon: assets/icon.png

win:
  target:
    - nsis
  icon: assets/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Brouser

linux:
  target:
    - AppImage
  category: Network
  maintainer: BaishevCorp
  icon: assets/icon.png

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: assets/icon.png
